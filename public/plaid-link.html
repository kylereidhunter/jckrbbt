<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JCKRBBT - Connect Brokerage</title>
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000; color: #fff; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', sans-serif;
    }
    .container { text-align: center; padding: 20px; }
    .dot { color: #00ff4e; font-size: 32px; animation: pulse 1.5s infinite; }
    .status { font-size: 12px; color: #525252; text-transform: uppercase; letter-spacing: 3px; margin-top: 12px; }
    .error { color: #FF4B2B; font-size: 13px; margin-top: 16px; max-width: 300px; line-height: 1.5; letter-spacing: 0.5px; }
    .close-btn {
      margin-top: 24px; padding: 12px 32px; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; background: transparent; color: #fff;
      font-size: 12px; text-transform: uppercase; letter-spacing: 2px; cursor: pointer;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <div class="container" id="container">
    <div class="dot">●</div>
    <p class="status" id="status">Connecting to Plaid...</p>
  </div>

  <script>
    // Parse URL params
    var params = new URLSearchParams(window.location.search);
    var linkToken = params.get('token');
    var redirectUri = params.get('redirect_uri');

    function showError(msg) {
      document.getElementById('container').innerHTML =
        '<div class="error">' + msg + '</div>' +
        '<button class="close-btn" onclick="window.close()">Close</button>';
    }

    if (!linkToken) {
      showError('Missing link token. Please try again from the app.');
    } else {
      document.getElementById('status').textContent = 'Opening Plaid...';

      try {
        var handler = Plaid.create({
          token: linkToken,
          onSuccess: function(publicToken, metadata) {
            document.getElementById('status').textContent = 'Connected! Returning to app...';

            // Build redirect URL with token data
            var callbackData = encodeURIComponent(JSON.stringify({
              publicToken: publicToken,
              institution: metadata.institution,
              accounts: metadata.accounts,
              link_session_id: metadata.link_session_id
            }));

            if (redirectUri) {
              window.location.href = redirectUri + '?plaid_data=' + callbackData;
            } else {
              // Fallback - show success
              document.getElementById('container').innerHTML =
                '<div style="color:#00ff4e;font-size:24px;">✓</div>' +
                '<p class="status" style="color:#00ff4e;">Connected! You can close this window.</p>' +
                '<button class="close-btn" onclick="window.close()">Close</button>';
            }
          },
          onExit: function(err, metadata) {
            if (redirectUri) {
              window.location.href = redirectUri + '?plaid_exit=true' +
                (err ? '&error=' + encodeURIComponent(JSON.stringify(err)) : '');
            } else {
              window.close();
            }
          },
          onLoad: function() {
            document.getElementById('status').textContent = '';
          },
          onEvent: function(eventName, metadata) {
            console.log('Plaid event:', eventName);
          }
        });
        handler.open();
      } catch(e) {
        showError('Failed to open Plaid: ' + e.message);
      }
    }
  </script>
</body>
</html>
